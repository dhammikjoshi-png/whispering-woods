<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Whispering Woods</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #0d0f0a;
    overflow: hidden;
    font-family: 'VT323', monospace;
    touch-action: none;
  }
  #gameRoot {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #gameCanvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background: #1a2a1a;
    max-width: 100%;
    max-height: 100%;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; top: 10px; left: 10px;
    display: flex; flex-direction: column; gap: 4px;
    pointer-events: none;
    z-index: 20;
  }
  #hearts { display: flex; gap: 3px; }
  .heart {
    width: 16px; height: 16px;
    background: #8B3A3A;
    clip-path: polygon(50% 15%, 61% 3%, 78% 3%, 93% 18%, 93% 35%, 50% 85%, 7% 35%, 7% 18%, 22% 3%, 39% 3%);
    filter: drop-shadow(1px 1px 0 #2b1a1a);
  }
  .heart.empty { background: #3a2a2a; }
  .heart.half { background: linear-gradient(90deg, #8B3A3A 50%, #3a2a2a 50%); }
  #stageLabel {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: #EDE0C8;
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 0.5px;
  }
  #locationLabel {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: #D9A441;
    text-shadow: 2px 2px 0 #000;
  }

  /* ---------- Top-right buttons ---------- */
  #topRight {
    position: absolute; top: 10px; right: 10px;
    display: flex; gap: 6px;
    z-index: 20;
  }
  .iconBtn {
    width: 34px; height: 34px;
    background: rgba(30,59,44,0.85);
    border: 2px solid #D9A441;
    color: #EDE0C8;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border-radius: 4px;
    pointer-events: auto;
  }

  /* ---------- Dialogue box ---------- */
  #dialogueBox {
    position: absolute;
    left: 4%; right: 4%; bottom: 4%;
    background: #EDE0C8;
    border: 3px solid #2B1A0F;
    clip-path: polygon(0% 4%, 2% 0%, 98% 0%, 100% 4%, 100% 96%, 98% 100%, 2% 100%, 0% 96%);
    padding: 14px 18px;
    display: none;
    z-index: 30;
    box-shadow: 0 6px 0 rgba(0,0,0,0.4);
    pointer-events: auto;
    cursor: pointer;
  }
  #dialogueSpeaker {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #1E3B2C;
    margin-bottom: 8px;
  }
  #dialogueText {
    font-size: 22px;
    line-height: 1.3;
    color: #2B1A0F;
    min-height: 56px;
  }
  #dialogueHint {
    font-size: 14px;
    color: #6b5a3a;
    text-align: right;
    margin-top: 4px;
  }

  /* ---------- Vision overlay ---------- */
  #visionOverlay {
    position: absolute; inset: 0;
    background: #2B2440;
    opacity: 0;
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    pointer-events: none;
  }
  #visionText {
    font-size: 26px;
    color: #EDE0C8;
    text-align: center;
    max-width: 80%;
    line-height: 1.5;
    text-shadow: 0 0 12px #9b7fd4;
    opacity: 0;
  }

  /* ---------- Touch controls ---------- */
  #touchControls {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 15;
    display: none;
  }
  #joystickZone {
    position: absolute; left: 18px; bottom: 18px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: rgba(237,224,200,0.12);
    border: 2px solid rgba(237,224,200,0.35);
    pointer-events: auto;
  }
  #joystickThumb {
    position: absolute; width: 46px; height: 46px;
    left: 32px; top: 32px;
    border-radius: 50%;
    background: rgba(217,164,65,0.75);
    border: 2px solid #EDE0C8;
  }
  #attackBtn {
    position: absolute; right: 22px; bottom: 26px;
    width: 74px; height: 74px;
    border-radius: 50%;
    background: rgba(139,58,58,0.75);
    border: 3px solid #EDE0C8;
    color: #EDE0C8;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }
  #interactBtn {
    position: absolute; right: 108px; bottom: 44px;
    width: 54px; height: 54px;
    border-radius: 50%;
    background: rgba(30,59,44,0.8);
    border: 3px solid #D9A441;
    color: #EDE0C8;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }

  /* ---------- Pause menu ---------- */
  #pauseMenu {
    position: absolute; inset: 0;
    background: rgba(10,12,8,0.82);
    display: none;
    align-items: center; justify-content: center;
    z-index: 60;
  }
  #pauseCard {
    background: #1E3B2C;
    border: 3px solid #D9A441;
    padding: 22px 26px;
    display: flex; flex-direction: column; gap: 12px;
    min-width: 220px;
  }
  #pauseCard h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: #EDE0C8;
    margin-bottom: 6px;
    text-align: center;
  }
  .pauseBtn {
    background: #2B1A0F;
    border: 2px solid #D9A441;
    color: #EDE0C8;
    font-family: 'VT323', monospace;
    font-size: 20px;
    padding: 10px;
    cursor: pointer;
  }
  .pauseBtn:active { background: #D9A441; color: #1E3B2C; }

  #toast {
    position: absolute; top: 54px; left: 50%;
    transform: translateX(-50%);
    background: rgba(30,59,44,0.92);
    border: 2px solid #D9A441;
    color: #EDE0C8;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 8px 14px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 25;
    pointer-events: none;
    text-align: center;
    max-width: 80%;
  }
</style>
</head>
<body>

<div id="gameRoot">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="hearts"></div>
    <div id="stageLabel">CHILD</div>
    <div id="locationLabel"></div>
  </div>

  <div id="topRight">
    <div class="iconBtn" id="pauseBtn">⏸</div>
  </div>

  <div id="toast"></div>

  <div id="dialogueBox">
    <div id="dialogueSpeaker"></div>
    <div id="dialogueText"></div>
    <div id="dialogueHint">tap to continue ▸</div>
  </div>

  <div id="visionOverlay">
    <div id="visionText"></div>
  </div>

  <div id="touchControls">
    <div id="joystickZone"><div id="joystickThumb"></div></div>
    <div id="interactBtn">TALK</div>
    <div id="attackBtn">ATTACK</div>
  </div>

  <div id="pauseMenu">
    <div id="pauseCard">
      <h2>WHISPERING WOODS</h2>
      <button class="pauseBtn" id="resumeBtn">Resume</button>
      <button class="pauseBtn" id="saveBtn">Save Game</button>
      <button class="pauseBtn" id="loadBtn">Load Game</button>
      <button class="pauseBtn" id="restartBtn">Restart Slice</button>
    </div>
  </div>
</div>

<script src="storage.js"></script>
<script src="audio.js"></script>
<script src="sprites.js"></script>
<script src="world.js"></script>
<script src="entities.js"></script>
<script src="dialogue.js"></script>
<script src="input.js"></script>
<script src="game.js"></script>
</body>
</html>
